name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: README sync
        run: scripts/check-readme-sync.sh

      - name: Setup Go
        if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Changed tool checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit; skipping changed-tool checks."
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit $base is not available; skipping changed-tool checks."
            exit 0
          fi

          mapfile -t tools < <(
            git diff --name-only "$base" "$GITHUB_SHA" \
              | awk -F/ '$1 ~ /^[0-9][0-9]-/ {print $1}' \
              | sort -u
          )

          if [ "${#tools[@]}" -eq 0 ]; then
            echo "No tool folders changed."
            exit 0
          fi

          failed=0
          for tool in "${tools[@]}"; do
            [ -d "$tool" ] || continue

            echo "::group::$tool conventions"
            scripts/check-tool-conventions.sh "$tool" || failed=1
            echo "::endgroup::"

            if [ -f "$tool/package.json" ] \
              && node -e "const p=require('./$tool/package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
              if [ -f "$tool/package-lock.json" ]; then
                install="npm ci --no-audit --no-fund"
              else
                install="npm install --no-audit --no-fund"
              fi

              echo "::group::$tool install"
              (cd "$tool" && $install) || failed=1
              echo "::endgroup::"

              echo "::group::$tool tests"
              (cd "$tool" && npm test) || failed=1
              echo "::endgroup::"
            fi

            if [ -f "$tool/go.mod" ]; then
              echo "::group::$tool go"
              if compgen -G "$tool/*_test.go" > /dev/null; then
                (cd "$tool" && go vet ./... && go test ./...) || failed=1
              else
                echo "$tool has no *_test.go files"
                failed=1
              fi
              echo "::endgroup::"
            fi

            if compgen -G "$tool/*.py" > /dev/null; then
              echo "::group::$tool python"
              if compgen -G "$tool/test_*.py" > /dev/null; then
                (cd "$tool" && python3 -m py_compile ./*.py \
                  && python3 -m unittest discover -s . -p 'test_*.py' -v) || failed=1
              else
                echo "$tool has no test_*.py files"
                failed=1
              fi
              echo "::endgroup::"
            fi

            if [ -f "$tool/manifest.json" ]; then
              echo "::group::$tool extension"
              node -e "
                const m = require('./$tool/manifest.json');
                if (m.manifest_version !== 3) { console.error('manifest_version must be 3'); process.exit(1); }
              " || failed=1
              (cd "$tool" && find . -type f -name '*.js' -not -path './node_modules/*' -print0 \
                | xargs -0 -r -n1 node --check) || failed=1
              if [ -d "$tool/test" ]; then
                (cd "$tool" && node --test) || failed=1
              fi
              echo "::endgroup::"
            fi
          done

          exit "$failed"
